name: Validate guide
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lost-sierra/package-lock.json
      - run: npm ci
      - run: npm ci --prefix lost-sierra
      - run: npm test --prefix lost-sierra
      - run: npm run audit:content --prefix lost-sierra -- --fail-on-errors
      - run: npx tsc --noEmit
      - run: npm run build --prefix lost-sierra
