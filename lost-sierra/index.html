<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f4f1e8"><meta name="description" content="Explore the rides, mountains, and off-bike adventures of the Lost Sierra in an interactive 3D guide."><title>Ride The Lost Sierra</title><link rel="icon" href="/mark.svg" type="image/svg+xml"></head>
<body class="guide-page"><header class="masthead"><h1>Ride <em>The Lost Sierra</em></h1><p>Northern California</p></header>
<main><div class="ride-panel"><aside class="sidebar ride-card"><div id="browse"><h2>Find a ride</h2><div class="tabs" role="group" aria-label="Explore type"><button data-kind="ride" class="active">On the bike</button><button data-kind="adventure">Off the bike</button></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Find a ride, trail, or town" aria-label="Search the guide"></label><div class="filters"><select id="area" aria-label="Filter by area"><option value="">All areas</option></select><select id="intensity" aria-label="Filter by effort"><option value="">All efforts</option></select></div><div class="list-heading"><span id="result-count"></span><button id="clear" class="text-button" hidden>Clear filters</button></div><div id="entries" class="entry-list" aria-live="polite"></div></div><div id="detail" hidden></div></aside><nav class="map-controls" aria-label="Map controls">
      <div id="compass" class="compass" role="group" aria-label="3D compass controls">
        <button id="tilt-up" type="button" aria-label="Hold to tilt view up" title="Hold to tilt view up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
        <button id="rotate-left" type="button" aria-label="Hold to rotate view left" title="Hold to rotate view left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
        <button id="north" type="button" title="Face north" aria-label="Face north"><svg id="compass-needle" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 27 21 20 18 13 21Z" fill="#b95a37"/><path d="M20 36 27 19 20 22 13 19Z" fill="#315653"/><circle cx="20" cy="20" r="2.5" fill="#fffaf0"/></svg></button>
        <button id="rotate-right" type="button" aria-label="Hold to rotate view right" title="Hold to rotate view right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button id="tilt-down" type="button" aria-label="Hold to tilt view down" title="Hold to tilt view down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
      </div>

    </nav></div>
<section id="map" aria-label="Interactive three dimensional map of the Lost Sierra"><div id="canvas"></div><div id="map-labels"></div><div class="map-heading"><span class="eyebrow" id="map-kicker">NORTHERN CALIFORNIA · 3D FIELD GUIDE</span><h2 id="map-title">A little further<br>from the ordinary.</h2></div><div id="loading" role="status">Painting the mountains…</div><div class="map-caption"><span id="map-status">Pick a ride. Watch the landscape open up.</span><span class="attribution"><span class="site-version">v%GUIDE_VERSION%</span> · Elevation: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener">AWS / USGS</a> · Exaggerated relief · Inspired by <a href="https://github.com/kneath/tahoe-trails" target="_blank" rel="noopener">Tahoe Trails</a></span></div></section></main>
<div id="toast" role="status"></div><script type="module" src="/src/main.js"></script></body></html>
